trigger:
  branches:
    include: [main, develop, "release-*" ]
  paths:
    exclude: [README.md, LICENSE.md, .gitignore]
  tags:
    include: ["v*"]

# PR always trigger build

# add nf-tools repo to resources (for Azure Pipelines templates)
resources:
  repositories:
    - repository: templates
      type: github
      name: nanoframework/nf-tools
      endpoint: nanoframework

jobs:

##############################
# build tools
- job: Build_tools

  pool:
    vmImage: 'windows-latest'

  variables:
    - group: sign-client-credentials
    - name: DOTNET_NOLOGO
      value: true
    - name: buildPlatform
      value: 'x64'
    - name: buildConfiguration
      value: 'Release'
    - name: solution
      value: 'nanoFramework.Tools.Hex2Dfu.sln'
    - name: toolName
      value: 'HEX2DFU utility'

  steps:

  # need this here in order to persist GitHub credentials
  - checkout: self
    persistCredentials: true

  - script: |
      git config --global user.email "nanoframework@outlook.com"
      git config --global user.name "nfbot"
    displayName: Setup git identity

  - template: azure-pipelines-templates/install-nuget.yml@templates

  - task: NuGetCommand@2
    inputs:
      restoreSolution: '$(solution)'
      verbosityRestore: quiet
  
  - script: nbgv cloud -a -c
    condition: ne(variables['system.pullrequest.isfork'], true)
    displayName: Set build number

  - task: PowerShell@2
    displayName: 'dotnet build Linux version'
    condition: succeeded()
    inputs:
      targetType: 'inline'
      script: |
        dotnet publish $(Build.SourcesDirectory)\hex2dfu\hex2dfu.csproj -r linux-x64 -p:PublishSingleFile=true --self-contained true -c Release

  - task: PowerShell@2
    displayName: 'dotnet build Windows version'
    condition: succeeded()
    inputs:
      targetType: 'inline'
      script: |
        dotnet publish $(Build.SourcesDirectory)\hex2dfu\hex2dfu.csproj -r win-x64 -p:PublishSingleFile=true --self-contained false -c Release

  - task: VSBuild@1
    inputs:
      solution: '$(solution)'
      platform: '$(buildPlatform)'
      msbuildArgs: '/p:PublicRelease=true'
      configuration: '$(buildConfiguration)'
    
  - task: VisualStudioTestPlatformInstaller@1
    condition: succeeded()
    displayName: 'Visual Studio Test Platform Installer'
    inputs:
      versionSelector: latestStable

  - task: VSTest@3
    condition: succeeded()
    displayName: 'Running tests'
    inputs:
      testSelector: 'testAssemblies'
      testAssemblyVer2: |
        **\$(BuildConfiguration)\**\Hex2BinTest.dll
        !**\obj\**
        !**\bin\**\ref\**
        !**\*TestAdapter.dll
        !**\*testhost.dll
        !**\*TestPlatform*.dll
        !**\xunit.*.dll
        !**\xunit.*.dll
      searchFolder: '$(System.DefaultWorkingDirectory)'
      platform: '$(BuildPlatform)'
      configuration: '$(BuildConfiguration)'
      diagnosticsEnabled: true
      vsTestVersion: toolsInstaller
      codeCoverageEnabled: true
  
  - task: CopyFiles@2
    displayName: Collecting deployable artifacts
    condition: succeeded()
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)\hex2dfu'
      Contents: |
        **\linux-x64\publish\*hex2dfu
        **\win-x64\publish\*hex2*.exe
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      flattenFolders: true

  - task: DotNetCoreCLI@2
    displayName: Install Sign Client CLI
    condition: >-
      and(
        succeeded(),
        eq(variables['System.PullRequest.PullRequestId'], '')
      )
    inputs:
      command: custom
      custom: tool
      arguments: install --tool-path . sign --version 0.9.1-beta.23530.1

  - pwsh: |
      .\sign code azure-key-vault `
      "**/hex2*.*" `
      --base-directory "$(Build.ArtifactStagingDirectory)" `
      --publisher-name ".NET nanoFramework" `
      --description "nanoFramework.hex2dfu" `
      --description-url "https://github.com/$env:Build_Repository_Name" `
      --azure-key-vault-tenant-id "$(SignTenantId)" `
      --azure-key-vault-client-id "$(SignClientId)" `
      --azure-key-vault-client-secret "$(SignClientSecret)" `
      --azure-key-vault-certificate "$(SignKeyVaultCertificate)" `
      --azure-key-vault-url "$(SignKeyVaultUrl)" `
      --timestamp-url http://timestamp.digicert.com
    displayName: Sign nanoFramework.hex2dfu assemblies
    continueOnError: true
    condition: >-
      and(
        succeeded(),
        eq(variables['System.PullRequest.PullRequestId'], '')
      )

  # publish artifacts (only possible if this is not a PR originated on a fork)
  - task: PublishBuildArtifacts@1
    displayName: Publish deployables artifacts
    condition: >-
      and(
        succeeded(),
        eq(variables['System.PullRequest.PullRequestId'], '')
      )
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: deployables
      ArtifactType: Container

  # create or update GitHub release
  - task: GithubRelease@1
    displayName: Create/Update GitHub release
    condition: >-
      and(
        succeeded(),
        eq(variables['System.PullRequest.PullRequestId'], ''),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    inputs:
      gitHubConnection: 'github.com_nano-$(System.TeamProject)'
      action: create
      isDraft: false
      tagSource: userSpecifiedTag
      tag: v$(GitBuildVersionSimple)
      title: '.NET nanoFramework hex2dfu v$(GitBuildVersionSimple)'
      assets: '$(Build.ArtifactStagingDirectory)/*'
      addChangeLog: true
      changeLogLabels: |
        [
          { "label" : "Type: bug", "displayName" : "Bugs fixed", "state" : "closed" },
          { "label" : "Type: enhancement", "displayName" : "Enhancements and new features", "state" : "closed" },
          { "label" : "Breaking-Change", "displayName" : "Breaking Changes", "state" : "closed" }
          { "label" : "Type: dependencies", "displayName" : "Dependencies updated", "state" : "closed" },
          { "label" : "Type: documentation", "displayName" : "Documentation", "state" : "closed" }
        ]      

##################################
# report build failure to Discord
- job: Report_Build_Failure

  dependsOn:
  - Build_tools
  condition: failed('Build_tools')

  pool:
    vmImage: 'windows-latest'

  steps:

  - checkout: self
    fetchDepth: 1

  # step from template @ nf-tools repo
  # report error
  - template: azure-pipelines-templates/discord-webhook.yml@templates  
    parameters:
      status: 'failure'
      webhookUrl: '$(DiscordWebhook)'
      message: ''
